openapi: 3.1.0
info:
  title: Natours API
  version: 1.0.0
  summary: The public REST API for the Natours tour catalogue (plan.md 4.1, 4.2).
servers:
  - url: /api/v1
paths:
  /tours:
    get:
      operationId: listTours
      summary: List the catalogue, with filters, sort, fields and paging.
      description: >-
        Filters, sort, fields and paging run in memory on one cached catalogue
        (ADR 0031). The query is strict: an unknown key, an operator the
        allowlist does not name, or a bad value is a 400 VALIDATION_ERROR.
        Values are digits only where a number is expected.
      parameters:
        - $ref: '#/components/parameters/difficulty'
        - $ref: '#/components/parameters/priceFilter'
        - $ref: '#/components/parameters/priceGte'
        - $ref: '#/components/parameters/priceGt'
        - $ref: '#/components/parameters/priceLte'
        - $ref: '#/components/parameters/priceLt'
        - $ref: '#/components/parameters/durationFilter'
        - $ref: '#/components/parameters/durationGte'
        - $ref: '#/components/parameters/durationGt'
        - $ref: '#/components/parameters/durationLte'
        - $ref: '#/components/parameters/durationLt'
        - $ref: '#/components/parameters/ratingsAverageFilter'
        - $ref: '#/components/parameters/ratingsAverageGte'
        - $ref: '#/components/parameters/ratingsAverageGt'
        - $ref: '#/components/parameters/ratingsAverageLte'
        - $ref: '#/components/parameters/ratingsAverageLt'
        - $ref: '#/components/parameters/maxGroupSizeFilter'
        - $ref: '#/components/parameters/maxGroupSizeGte'
        - $ref: '#/components/parameters/maxGroupSizeGt'
        - $ref: '#/components/parameters/maxGroupSizeLte'
        - $ref: '#/components/parameters/maxGroupSizeLt'
        - $ref: '#/components/parameters/month'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/fields'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: One page of tours, with the page, limit and total.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TourListEnvelope'
        '400':
          description: The query was refused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                status: fail
                error:
                  code: VALIDATION_ERROR
                  message: The query is not valid.
                  details:
                    - path: page
                      message: Enter a whole number.
                  requestId: 0b2f6f46-5a62-4a26-9c2b-61f8c0d7a111
        '500':
          description: An unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: MongoDB cannot be reached (B10).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      operationId: createTour
      summary: Create a tour with no cover (lead guide or admin).
      description: >-
        Creates a tour from strict JSON (F6, B4, D-12). The tour has no cover, so
        `imageCover` is null, and it stays out of every public read until a photo
        with its credit is added (D-13, ADR 0036). Lead guides and admins only, an
        exact role match (D-16, ADR 0037). Clears the `tours` cache.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TourCreateBody'
      responses:
        '201':
          description: The tour, with its guides and a null imageCover.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TourDetailEnvelope'
        '400':
          description: >-
            The body is not valid. Each refused key, such as `images`, `imageCover`,
            `photoCredits`, `slug`, `ratingsAverage` or an unknown key, is named by its
            path, as is a guide id that is not a guide.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No one is signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The caller is not a lead guide or admin, or the Origin is another site's.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Another tour already has this name or slug.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                status: fail
                error:
                  code: CONFLICT
                  message: A tour with that name already exists.
                  requestId: 0b2f6f46-5a62-4a26-9c2b-61f8c0d7a114
        '500':
          description: An unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: MongoDB cannot be reached (B10).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /tours/{id}:
    get:
      operationId: getTour
      summary: One tour with its public guides.
      description: >-
        The tour as its page shows it (B13), with `guides` added: the lead guide
        first, then the others in the tour's order. Each guide carries only id,
        name, photo and role (S3). A tour whose guides are all missing has
        `guides: []`.
      parameters:
        - $ref: '#/components/parameters/tourId'
      responses:
        '200':
          description: The tour, with its guides.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TourDetailEnvelope'
        '400':
          description: The id is not 24 hexadecimal characters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                status: fail
                error:
                  code: VALIDATION_ERROR
                  message: The request is not valid.
                  requestId: 0b2f6f46-5a62-4a26-9c2b-61f8c0d7a112
        '404':
          description: No tour has this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                status: fail
                error:
                  code: NOT_FOUND
                  message: The tour was not found.
                  requestId: 0b2f6f46-5a62-4a26-9c2b-61f8c0d7a113
        '500':
          description: An unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: MongoDB cannot be reached (B10).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      operationId: updateTour
      summary: Change some of a tour's editable fields (lead guide or admin).
      description: >-
        Only the editable fields are accepted (B4, S4). An image, credit, slug or
        rating key, or any unknown key, is a 400 that names each path, and an empty
        body is a 400. The tour is loaded, set and saved, so the validators and the
        slug hook run: a rename regenerates the slug (QA-04). A repeat of the same
        PATCH leaves the same tour (F6). Clears `tours` and `tour:<id>`. Lead guides
        and admins only (D-16, ADR 0037).
      parameters:
        - $ref: '#/components/parameters/tourId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TourUpdateBody'
      responses:
        '200':
          description: The tour after the change, with its guides.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TourDetailEnvelope'
        '400':
          description: >-
            The id or body is not valid, a key is refused (named by path), or a guide
            id is not a guide.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No one is signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The caller is not a lead guide or admin, or the Origin is another site's.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No tour has this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Another tour already has this name or slug.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: An unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: MongoDB cannot be reached (B10).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      operationId: deleteTour
      summary: Delete a tour that has no booking (lead guide or admin).
      description: >-
        Refused with 409 while the tour has any booking, paid or refunded, and then
        nothing is removed (F6, T-04-34). Otherwise the tour is deleted, then its
        reviews, then its stored photos, best effort. A second delete of the same
        tour is 404. Clears `tours`, `tour:<id>` and `reviews:<id>`. Lead guides and
        admins only (D-16, ADR 0037).
      parameters:
        - $ref: '#/components/parameters/tourId'
      responses:
        '204':
          description: The tour, its reviews and its stored photos are gone. No body.
        '401':
          description: No one is signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The caller is not a lead guide or admin, or the Origin is another site's.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No tour has this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: The tour has a booking, so it is not deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                status: fail
                error:
                  code: CONFLICT
                  message: This tour has bookings, so it can't be deleted.
                  requestId: 0b2f6f46-5a62-4a26-9c2b-61f8c0d7a115
        '500':
          description: An unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: MongoDB cannot be reached (B10).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /tours/top-5-cheap:
    get:
      operationId: getTop5Cheap
      summary: The five cheapest tours, in ascending price.
      description: >-
        An alias that goes through the same query as GET /tours (B2): sorted by
        price, then by rating descending, then name and id, limited to five. It
        takes no parameters; any query parameter is a 400 VALIDATION_ERROR. With
        fewer than five tours it returns all of them, and with none it returns
        an empty list with a total of 0.
      responses:
        '200':
          description: Up to five tours, with the page, limit and total.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TourListEnvelope'
        '400':
          description: The query carried a parameter; this route takes none.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                status: fail
                error:
                  code: VALIDATION_ERROR
                  message: The query is not valid.
                  requestId: 0b2f6f46-5a62-4a26-9c2b-61f8c0d7a114
        '500':
          description: An unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: MongoDB cannot be reached (B10).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /tours/stats:
    get:
      operationId: getTourStats
      summary: Tour statistics, one row per difficulty.
      description: >-
        Public (F1). Computed in memory from the cached catalogue, so it always
        agrees with the list, and two parallel calls return the same body. Rows
        come in the order easy, medium, difficult, and only the difficulties
        that have tours appear. `avgRating` is the mean of the tours' average
        ratings, to one decimal place. `avgPrice` is the mean price in whole
        rupees.
      responses:
        '200':
          description: One row per difficulty that has tours.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TourStatsEnvelope'
        '400':
          description: The query carried a parameter; this route takes none.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: An unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: MongoDB cannot be reached (B10).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /tours/monthly-plan/{year}:
    get:
      operationId: getMonthlyPlan
      summary: The year's tour starts, grouped by IST month.
      description: >-
        For guides, lead guides and admins only (F2). An anonymous caller gets
        401 UNAUTHENTICATED and a user gets 403 FORBIDDEN. Every start date in
        the year counts, and months are cut in Asia/Kolkata, so a 1 January
        departure is in January (QA-10). Months come in order, and only months
        with a start appear. The plan is not cached.
      parameters:
        - name: year
          in: path
          required: true
          description: Four digits, from 2000 to 2100. Anything else is a 400.
          schema:
            type: string
            pattern: '^\d{4}$'
            example: '2027'
      responses:
        '200':
          description: The plan for the year.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyPlanEnvelope'
        '400':
          description: The year is not four digits from 2000 to 2100, or the query carried a parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No one is signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                status: fail
                error:
                  code: UNAUTHENTICATED
                  message: Sign in to continue.
                  requestId: 0b2f6f46-5a62-4a26-9c2b-61f8c0d7a115
        '403':
          description: The signed-in user is not a guide, lead guide or admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                status: fail
                error:
                  code: FORBIDDEN
                  message: You do not have permission to do that.
                  requestId: 0b2f6f46-5a62-4a26-9c2b-61f8c0d7a116
        '500':
          description: An unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: MongoDB cannot be reached (B10).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /tours/within/{distance}/center/{latlng}/unit/{unit}:
    get:
      operationId: getToursWithin
      summary: The tours whose start lies within a radius of a point.
      description: >-
        Public (B3). Returns tour summaries as documents, never a query plan,
        sorted by name. The point is `lat,lng`: latitude −90 to 90 and longitude
        −180 to 180, both ends included. The distance is above 0 and at most
        20000, in the unit. A radius with no start location gives `tours: []`.
        The response is not paginated.
      parameters:
        - name: distance
          in: path
          required: true
          description: A number above 0 and at most 20000, in the unit.
          schema:
            type: number
            exclusiveMinimum: 0
            maximum: 20000
            example: 300
        - name: latlng
          in: path
          required: true
          description: Latitude then longitude, comma separated, such as 28.6139,77.209.
          schema:
            type: string
            example: '28.6139,77.209'
        - name: unit
          in: path
          required: true
          description: mi for miles or km for kilometres.
          schema:
            type: string
            enum: [mi, km]
      responses:
        '200':
          description: The tours inside the radius, by name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithinEnvelope'
        '400':
          description: A coordinate, the distance or the unit is out of range or malformed. MongoDB is not queried.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                status: fail
                error:
                  code: VALIDATION_ERROR
                  message: The request is not valid.
                  requestId: 0b2f6f46-5a62-4a26-9c2b-61f8c0d7a117
        '500':
          description: An unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: MongoDB cannot be reached (B10).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /tours/distances/{latlng}/unit/{unit}:
    get:
      operationId: getTourDistances
      summary: Every tour's distance from a point, nearest first.
      description: >-
        Public (B3). Each entry is `{ id, name, slug, distance }`, with the
        distance rounded to 2 decimal places in the unit. The first stage of the
        query is a $geoNear on the start location, so the result is documents
        and never a query plan. The response is not paginated.
      parameters:
        - name: latlng
          in: path
          required: true
          description: Latitude then longitude, comma separated, such as 28.6139,77.209.
          schema:
            type: string
            example: '28.6139,77.209'
        - name: unit
          in: path
          required: true
          description: mi for miles or km for kilometres.
          schema:
            type: string
            enum: [mi, km]
      responses:
        '200':
          description: Every tour, nearest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistancesEnvelope'
        '400':
          description: A coordinate or the unit is out of range or malformed. MongoDB is not queried.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                status: fail
                error:
                  code: VALIDATION_ERROR
                  message: The request is not valid.
                  requestId: 0b2f6f46-5a62-4a26-9c2b-61f8c0d7a118
        '500':
          description: An unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: MongoDB cannot be reached (B10).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  parameters:
    tourId:
      name: id
      in: path
      required: true
      description: The 24-character hexadecimal tour id.
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
        example: 92da98fc3b348f5b6de92063
    difficulty:
      name: difficulty
      in: query
      required: false
      description: The difficulty of the tour.
      schema:
        type: string
        enum: [easy, medium, difficult]
    priceFilter:
      name: price
      in: query
      required: false
      description: The price in whole rupees, by equality.
      schema:
        type: number
        minimum: 0
    priceGte:
      name: 'price[gte]'
      in: query
      required: false
      description: The price is at least this many rupees (inclusive).
      schema:
        type: number
        minimum: 0
    priceGt:
      name: 'price[gt]'
      in: query
      required: false
      description: The price is more than this many rupees.
      schema:
        type: number
        minimum: 0
    priceLte:
      name: 'price[lte]'
      in: query
      required: false
      description: The price is at most this many rupees (inclusive).
      schema:
        type: number
        minimum: 0
    priceLt:
      name: 'price[lt]'
      in: query
      required: false
      description: The price is less than this many rupees.
      schema:
        type: number
        minimum: 0
    durationFilter:
      name: duration
      in: query
      required: false
      description: The length in days, by equality.
      schema:
        type: number
        minimum: 0
    durationGte:
      name: 'duration[gte]'
      in: query
      required: false
      description: The length is at least this many days (inclusive).
      schema:
        type: number
        minimum: 0
    durationGt:
      name: 'duration[gt]'
      in: query
      required: false
      description: The length is more than this many days.
      schema:
        type: number
        minimum: 0
    durationLte:
      name: 'duration[lte]'
      in: query
      required: false
      description: The length is at most this many days (inclusive).
      schema:
        type: number
        minimum: 0
    durationLt:
      name: 'duration[lt]'
      in: query
      required: false
      description: The length is less than this many days.
      schema:
        type: number
        minimum: 0
    ratingsAverageFilter:
      name: ratingsAverage
      in: query
      required: false
      description: The average rating, by equality.
      schema:
        type: number
        minimum: 0
        maximum: 5
    ratingsAverageGte:
      name: 'ratingsAverage[gte]'
      in: query
      required: false
      description: The average rating is at least this value (inclusive).
      schema:
        type: number
        minimum: 0
        maximum: 5
    ratingsAverageGt:
      name: 'ratingsAverage[gt]'
      in: query
      required: false
      description: The average rating is more than this value.
      schema:
        type: number
        minimum: 0
        maximum: 5
    ratingsAverageLte:
      name: 'ratingsAverage[lte]'
      in: query
      required: false
      description: The average rating is at most this value (inclusive).
      schema:
        type: number
        minimum: 0
        maximum: 5
    ratingsAverageLt:
      name: 'ratingsAverage[lt]'
      in: query
      required: false
      description: The average rating is less than this value.
      schema:
        type: number
        minimum: 0
        maximum: 5
    maxGroupSizeFilter:
      name: maxGroupSize
      in: query
      required: false
      description: The largest group, by equality.
      schema:
        type: number
        minimum: 0
    maxGroupSizeGte:
      name: 'maxGroupSize[gte]'
      in: query
      required: false
      description: The largest group is at least this many people (inclusive).
      schema:
        type: number
        minimum: 0
    maxGroupSizeGt:
      name: 'maxGroupSize[gt]'
      in: query
      required: false
      description: The largest group is more than this many people.
      schema:
        type: number
        minimum: 0
    maxGroupSizeLte:
      name: 'maxGroupSize[lte]'
      in: query
      required: false
      description: The largest group is at most this many people (inclusive).
      schema:
        type: number
        minimum: 0
    maxGroupSizeLt:
      name: 'maxGroupSize[lt]'
      in: query
      required: false
      description: The largest group is less than this many people.
      schema:
        type: number
        minimum: 0
    month:
      name: month
      in: query
      required: false
      description: >-
        A tour matches when it has a bookable departure (after today, IST) in
        this calendar month.
      schema:
        type: string
        pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        example: '2027-01'
    sort:
      name: sort
      in: query
      required: false
      description: >-
        A comma list of at most five tokens, each a field name, prefixed with
        `-` for descending. Each field appears once. Name and then id always
        break ties. Default -createdAt. Sort tokens are case-sensitive.
      schema:
        type: string
        example: price,-ratingsAverage
    fields:
      name: fields
      in: query
      required: false
      description: >-
        A comma list of TourSummary keys. The id is always returned. Default is
        every key.
      schema:
        type: string
        example: name,price
    page:
      name: page
      in: query
      required: false
      description: One-based page number. A page past the end answers an empty list.
      schema:
        type: integer
        minimum: 1
        default: 1
    limit:
      name: limit
      in: query
      required: false
      description: Items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  schemas:
    StartLocation:
      type: object
      required: [coordinates, address, description]
      properties:
        coordinates:
          type: array
          items:
            type: number
          minItems: 2
          maxItems: 2
          description: Longitude first, then latitude (GeoJSON).
        address:
          type: string
          example: Rishikesh, Uttarakhand
        description:
          type: string
    TourSummary:
      type: object
      description: A tour as the catalogue and cards show it (S3, R6).
      required:
        [
          id,
          name,
          slug,
          duration,
          maxGroupSize,
          difficulty,
          price,
          ratingsAverage,
          ratingsQuantity,
          summary,
          imageCover,
          startDates,
          createdAt,
          startLocation,
        ]
      properties:
        id:
          type: string
          example: 92da98fc3b348f5b6de92063
        name:
          type: string
          example: Rishikesh Ganga Rafting
        slug:
          type: string
          example: rishikesh-ganga-rafting
        duration:
          type: integer
          description: Length in days.
          minimum: 1
        maxGroupSize:
          type: integer
          minimum: 1
        difficulty:
          type: string
          enum: [easy, medium, difficult]
        price:
          type: integer
          description: Price in whole rupees (B20).
          minimum: 1
        ratingsAverage:
          type: number
          minimum: 1
          maximum: 5
        ratingsQuantity:
          type: integer
          minimum: 0
        summary:
          type: string
        imageCover:
          type: string
          description: A storage key, not a URL.
        startDates:
          type: array
          description: Each is an IST calendar day, YYYY-MM-DD (B19).
          items:
            type: string
            format: date
        createdAt:
          type: string
          format: date-time
        startLocation:
          $ref: '#/components/schemas/StartLocation'
    TourListMeta:
      type: object
      required: [page, limit, total]
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
    TourListEnvelope:
      type: object
      required: [status, data, meta]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [tours]
          properties:
            tours:
              type: array
              items:
                $ref: '#/components/schemas/TourSummary'
        meta:
          $ref: '#/components/schemas/TourListMeta'
    DifficultyStats:
      description: One difficulty's figures (F1). Prices are whole rupees.
      type: object
      required:
        [
          difficulty,
          numTours,
          numRatings,
          avgRating,
          avgPrice,
          minPrice,
          maxPrice,
        ]
      properties:
        difficulty:
          type: string
          enum: [easy, medium, difficult]
        numTours:
          type: integer
          example: 6
        numRatings:
          type: integer
          description: The sum of the tours' rating counts.
          example: 24
        avgRating:
          type: number
          description: The mean average rating, to one decimal place.
          example: 4.7
        avgPrice:
          type: integer
          description: The mean price, in whole rupees.
          example: 27999
        minPrice:
          type: integer
          example: 16999
        maxPrice:
          type: integer
          example: 38999
    TourStatsEnvelope:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [stats]
          properties:
            stats:
              type: array
              items:
                $ref: '#/components/schemas/DifficultyStats'
    MonthlyPlanMonth:
      description: One month of the year's plan (F2), in IST.
      type: object
      required: [month, numTourStarts, tours]
      properties:
        month:
          type: integer
          minimum: 1
          maximum: 12
          example: 1
        numTourStarts:
          type: integer
          description: Every start date that falls in this month, one per departure.
          example: 6
        tours:
          type: array
          description: The distinct names of the tours that start in this month, sorted.
          items:
            type: string
    MonthlyPlanEnvelope:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [plan]
          properties:
            plan:
              type: array
              items:
                $ref: '#/components/schemas/MonthlyPlanMonth'
    WithinEnvelope:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [tours]
          properties:
            tours:
              type: array
              items:
                $ref: '#/components/schemas/TourSummary'
    TourDistance:
      description: A tour and its distance from a point (B3). Only these four keys.
      type: object
      required: [id, name, slug, distance]
      properties:
        id:
          type: string
          example: 5c8a1d5b0190b214360dc057
        name:
          type: string
          example: Golden Triangle Heritage
        slug:
          type: string
          example: golden-triangle-heritage
        distance:
          type: number
          description: In the requested unit, rounded to 2 decimal places.
          example: 4.68
    DistancesEnvelope:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [distances]
          properties:
            distances:
              type: array
              description: Every tour, nearest first.
              items:
                $ref: '#/components/schemas/TourDistance'
    TourStartLocationInput:
      type: object
      description: The meeting point of a tour. Coordinates are GeoJSON order, longitude first.
      additionalProperties: false
      required: [coordinates, address, description]
      properties:
        coordinates:
          type: array
          minItems: 2
          maxItems: 2
          description: '[longitude, latitude]: longitude −180 to 180, latitude −90 to 90.'
          items:
            type: number
        address:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
    TourLocationInput:
      type: object
      description: One stop of the itinerary, on a day of the tour.
      additionalProperties: false
      required: [coordinates, description, day]
      properties:
        coordinates:
          type: array
          minItems: 2
          maxItems: 2
          description: '[longitude, latitude], in range as for the start location.'
          items:
            type: number
        description:
          type: string
          minLength: 1
        day:
          type: integer
          minimum: 1
    TourCreateBody:
      type: object
      description: >-
        The tour to create (F6, B4, D-13). Strict JSON: an unknown key is a 400. There is
        no cover, gallery, credit, rating or slug field, so the new tour has no photo until
        one is added with its credit (D-14).
      additionalProperties: false
      required:
        [
          name,
          duration,
          maxGroupSize,
          difficulty,
          price,
          summary,
          startLocation,
        ]
      properties:
        name:
          type: string
          minLength: 10
          maxLength: 40
          description: Trimmed before the length check.
        duration:
          type: integer
          minimum: 1
          description: Days.
        maxGroupSize:
          type: integer
          minimum: 1
        difficulty:
          type: string
          enum: [easy, medium, difficult]
        price:
          type: integer
          minimum: 1
          description: Whole rupees.
        summary:
          type: string
          minLength: 1
        description:
          type: string
        startDates:
          type: array
          uniqueItems: true
          description: IST calendar days (YYYY-MM-DD). Each is stored as 00:00 IST (B19).
          items:
            type: string
            format: date
        startLocation:
          $ref: '#/components/schemas/TourStartLocationInput'
        locations:
          type: array
          items:
            $ref: '#/components/schemas/TourLocationInput'
        guides:
          type: array
          description: Ids of active users whose role is guide or lead-guide.
          items:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
    TourUpdateBody:
      type: object
      description: >-
        The editable fields of a tour (B4, S4). Every field is optional, but at least one
        is required. Strict: images, imageCover, photoCredits, slug, ratingsAverage,
        ratingsQuantity and any unknown key are a 400 that names the path.
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 10
          maxLength: 40
          description: Trimmed before the length check. A rename regenerates the slug.
        duration:
          type: integer
          minimum: 1
        maxGroupSize:
          type: integer
          minimum: 1
        difficulty:
          type: string
          enum: [easy, medium, difficult]
        price:
          type: integer
          minimum: 1
          description: Whole rupees.
        summary:
          type: string
          minLength: 1
        description:
          type: string
        startDates:
          type: array
          uniqueItems: true
          items:
            type: string
            format: date
        startLocation:
          $ref: '#/components/schemas/TourStartLocationInput'
        locations:
          type: array
          items:
            $ref: '#/components/schemas/TourLocationInput'
        guides:
          type: array
          items:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
    ErrorDetail:
      type: object
      required: [path, message]
      properties:
        path:
          type: string
        message:
          type: string
    ErrorEnvelope:
      type: object
      description: The plan.md 4.1 failure body. It never carries a stack or a cause (SEC-11).
      required: [status, error]
      properties:
        status:
          type: string
          enum: [fail, error]
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
            requestId:
              type: string
              format: uuid
    PublicUser:
      type: object
      description: What guides and review authors look like to anyone. It has no email (S3).
      required: [id, name, photo, role]
      properties:
        id:
          type: string
          example: 2edcba4a2bb2e3be057fed4e
        name:
          type: string
          example: Gaurav Bisht
        photo:
          type: [string, 'null']
        role:
          type: string
          enum: [user, guide, lead-guide, admin]
    TourPhotoCredit:
      type: object
      description: One photo's credit. `alt` is always text (D-15).
      required: [file, title, author, license, licenseUrl, sourceUrl, alt]
      properties:
        file:
          type: string
          description: A storage key, not a URL.
        title:
          type: string
        author:
          type: string
        license:
          type: string
          example: CC BY-SA 4.0
        licenseUrl:
          type: string
          format: uri
        sourceUrl:
          type: string
          format: uri
        alt:
          type: string
    TourDetail:
      description: The tour as its detail page shows it, without guide objects (plan 04-06).
      allOf:
        - $ref: '#/components/schemas/TourSummary'
        - type: object
          required: [description, images, locations, guideIds, photoCredits]
          properties:
            description:
              type: [string, 'null']
            images:
              type: array
              description: Storage keys of the gallery photos, in order.
              items:
                type: string
            locations:
              type: array
              items:
                type: object
                required: [day, description, coordinates]
                properties:
                  day:
                    type: integer
                    minimum: 1
                  description:
                    type: string
                  coordinates:
                    type: array
                    items:
                      type: number
                    minItems: 2
                    maxItems: 2
            guideIds:
              type: array
              description: The tour's guides in its own order.
              items:
                type: string
            photoCredits:
              type: array
              items:
                $ref: '#/components/schemas/TourPhotoCredit'
    TourWithGuides:
      allOf:
        - $ref: '#/components/schemas/TourDetail'
        - type: object
          required: [guides]
          properties:
            guides:
              type: array
              description: The lead guide first, then the others in the tour's order.
              items:
                $ref: '#/components/schemas/PublicUser'
    TourDetailEnvelope:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [tour]
          properties:
            tour:
              $ref: '#/components/schemas/TourWithGuides'
