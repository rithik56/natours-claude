name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Lint CSS
        run: npm run lint:css
      - name: Check formatting
        run: npm run format:check
      - name: Check client boundaries
        run: npm run check:client
      - name: Check conventions
        run: npm run check:conventions
      - name: Check environment template
        run: npm run check:env
      - name: Find unused code and dependencies
        run: npm run knip
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Test with coverage
        run: npm run test:coverage

  build:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # No env block on purpose: a build that needs no secrets proves ARC-07.
      - name: Build
        run: npm run build
      - name: Generate a session secret for the smoke run
        run: echo "SESSION_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
      - name: Smoke test the built app
        run: npm run smoke
        env:
          APP_ENV: ci
          APP_URL: http://localhost:3210
          MONGODB_URI: mongodb://127.0.0.1:27017/natours
